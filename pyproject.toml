[project]
name = "riftroute"
version = "0.0.1"
description = "Open-source simulator for green leaf tea collection routing at Kenyan tea factories. Litein is the first example."
readme = "README.md"
authors = [
    { name = "Teddy Kipchirchir", email = "81567186+Teddy-Gitcode@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "osmnx>=2.1.1",
    "scipy>=1.17.1",
]

[project.urls]
Repository = "https://github.com/Teddy-Gitcode/riftroute"

[project.scripts]
riftroute = "riftroute:main"

[tool.maturin]
module-name = "riftroute._core"
python-packages = ["riftroute"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
